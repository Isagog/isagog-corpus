name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # tests/test_duplicati.py loads examples/duplicati.py, which needs python-dotenv.
      - run: uv sync --group dev --extra examples
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # The contract suite runs twice here: FakeCorpus and DirectusCorpus.
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90
      - run: ./scripts/check_boundaries.sh

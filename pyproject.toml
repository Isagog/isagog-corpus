[project]
name = "isagog-corpus"
version = "0.1.0"
description = "Abstract newspaper-archive data access layer (Corpus port) with a Directus specialization"
readme = "README.md"
requires-python = ">=3.13"

# The port itself needs only pydantic. httpx is here because the Directus
# adapter ships in the same distribution; no consumer of `corpus/` may import
# it (enforced by scripts/check_boundaries.sh).
dependencies = [
    "pydantic>=2.10.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# `corpus.testing.contract` (the adapter specification) runs under pytest.
# Everything else in `corpus.testing` — FakeCorpus included — is production
# importable without it.
testing = ["pytest>=8.4.0", "pytest-asyncio>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpus", "corpus_directus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--strict-markers"]
markers = [
    "unit: pure logic, no I/O",
    "integration: adapter over a mocked transport",
    "staging: runs against a live Directus instance (manual)",
]

[tool.coverage.run]
source = ["corpus", "corpus_directus"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["corpus", "corpus_directus", "tests"]
# Design docs carry illustrative Python in fenced blocks; they are prose, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"temporalio".msg = "The corpus library must not depend on Temporal; consumers own retry semantics."

[tool.pyright]
include = ["corpus", "corpus_directus", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
